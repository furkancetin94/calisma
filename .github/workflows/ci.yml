name: Merhaba Dünya CI

on:
  push:
    branches: [ master ]
  workflow_dispatch:  # Elle tetikleme desteği

jobs:
  self_hosted_job:
    name: Merhaba Dünya (Self-hosted)
    runs-on: self-hosted

    steps:
      - name: Dosya oluştur
        run: echo "Bu dosya self-hosted runner tarafından oluşturuldu" > output.txt

      - name: Artifakt olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: mesaj-dosyasi
          path: output.txt

  enocsi-scan:
    name: Enocsi Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: read
      
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull test image
        run: |
          docker pull ghcr.io/furkancetin94/test-image:latest
          docker images
        
      - name: Fetch Enocsi OIDC token
        id: enocsi-oidc
        run: |
          response=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=enocsi")
          token=$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync(0,'utf8')).value)" <<< "$response")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Enocsi Security Scan
        env:
          ENOCSI_CUSTOM_TOKEN: ${{ steps.enocsi-oidc.outputs.token }}
          ENOCSI_PROJECT_NAME: "oxagin"
          ENOCSI_REPOSITORY_NAME: "calisma"
          ENOCSI_ENVIRONMENT: "Production"
          ENOCSI_API_URL: "https://api.enocsi.com"
        run: |
          wget -q https://github.com/enocsi/cli/releases/latest/download/container-analyzer-linux-amd64 -O container-analyzer
          chmod +x container-analyzer
          ./container-analyzer -i ghcr.io/furkancetin94/test-image:latest
